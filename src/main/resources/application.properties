spring.application.name=mensagens-posto-saude
server.port=${PORT:8082}
spring.jpa.open-in-view=false
spring.config.import=optional:classpath:local.properties

# Banco de dados
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postoteste}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${spring.datasource.password}}
spring.jpa.hibernate.ddl-auto=update

# Envio de mensagens
mensagem.sender=${MENSAGEM_SENDER:evolution}
mensagem.intervalo-ms=${MENSAGEM_INTERVALO_MS:2000}

# Evolution API
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8081}
evolution.api.instance=${EVOLUTION_API_INSTANCE:Sistema}
evolution.api.key=${EVOLUTION_API_KEY}