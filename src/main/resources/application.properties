spring.application.name=mensagens-posto-saude
server.port=${PORT:8082}
spring.jpa.open-in-view=false
spring.config.import=optional:classpath:local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/postoteste
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=update

mensagem.sender=evolution

# Evolution API
evolution.api.url=http://localhost:8081
evolution.api.instance=Sistema
evolution.api.key=${EVOLUTION_API_KEY}

mensagem.intervalo-ms=2000