<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mensagens</title>
</head>
<body>
<h1>Enviar mensagem</h1>
<form th:action="@{/logout}" method="post">
    <button type="submit">Sair</button>
</form>
<a th:href="@{/pacientes}">Pacientes</a>
<a th:href="@{/modelos}">Modelos</a>

<div th:if="${mensagem}" th:text="${mensagem}" style="color:green"></div>
<div th:if="${erro}" th:text="${erro}" style="color:red"></div>

<form th:action="@{/mensagens}" method="post">
        <label>Usar modelo:
            <select id="modelo">
                <option value="">escolher...</option>
                <option th:each="m : ${modelos}" th:value="${m.texto}" th:text="${m.titulo}"></option>
            </select>
        </label>
        <br>
        <textarea name="texto" id="texto" rows="4" cols="50" maxlength="1000"
                  placeholder="Ex.: Olá, {nome}! Salve o telefone do posto de saúde na sua agenda."></textarea>

    <h3>Destinatários</h3>
    <input type="text" id="busca" placeholder="Filtrar por nome ou telefone">
    <label><input type="checkbox" id="todos"> Marcar todos os filtrados</label>
    <span id="contador">0 selecionados</span>

    <table border="1" id="tabela">
        <thead><tr><th></th><th>Nome</th><th>Telefone</th></tr></thead>
        <tbody>
        <tr th:each="p : ${pacientes}"
            th:attr="data-busca=${#strings.toLowerCase(p.nome + ' ' + p.telefone)}">
            <td><input type="checkbox" name="ids" th:value="${p.id}"></td>
            <td th:text="${p.nome}"></td>
            <td th:text="${p.telefone}"></td>
        </tr>
        </tbody>
    </table>

    <button type="submit">Enviar para os selecionados</button>
</form>

<h2>Histórico</h2>
<table border="1">
    <tr><th>Data</th><th>Mensagem</th><th>Destinatários</th><th>Falhas</th><th></th></tr>
    <tr th:each="e : ${envios}">
        <td th:text="${#temporals.format(e.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${e.texto}"></td>
        <td th:text="${e.totalDestinatarios}"></td>
        <td th:text="${e.falhas}"></td>
        <td><a th:href="@{/mensagens/{id}(id=${e.id})}">Detalhes</a></td>
    </tr>
</table>

<script>
    const busca = document.getElementById('busca');
    const todos = document.getElementById('todos');
    const contador = document.getElementById('contador');
    const linhas = () => document.querySelectorAll('#tabela tbody tr');

    function atualizarContador() {
        const n = document.querySelectorAll('#tabela tbody input:checked').length;
        contador.textContent = n + ' selecionados';
    }

    busca.addEventListener('input', () => {
        const termo = busca.value.toLowerCase().trim();
        linhas().forEach(tr => {
            tr.style.display = tr.dataset.busca.includes(termo) ? '' : 'none';
        });
    });

    todos.addEventListener('change', () => {
        linhas().forEach(tr => {
            if (tr.style.display !== 'none') {
                tr.querySelector('input').checked = todos.checked;
            }
        });
        atualizarContador();
    });

    document.getElementById('modelo').addEventListener('change', e => {
        if (e.target.value) {
            document.getElementById('texto').value = e.target.value;
        }
    });

    document.querySelector('#tabela tbody').addEventListener('change', atualizarContador);
</script>
</body>
</html>
