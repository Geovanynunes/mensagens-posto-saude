<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | ConectaSaúde</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<main class="login-container">
    <section class="login-card">

        <div class="login-header">
            <div class="login-icon" aria-hidden="true">+</div>
            <h1>ConectaSaúde</h1>
            <p>Acesso ao sistema do posto de saúde</p>
        </div>

        <div class="mensagem erro" th:if="${param.error}">
            Usuário ou senha inválidos.
        </div>

        <div class="mensagem sucesso" th:if="${param.logout}">
            Você saiu do sistema com segurança.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username"
                       placeholder="Digite seu usuário"
                       autocomplete="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password"
                       placeholder="Digite sua senha"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primario btn-bloco">Entrar no sistema</button>
        </form>

        <p class="login-footer">Acesso exclusivo aos profissionais autorizados.</p>

    </section>
</main>

</body>
</html>
